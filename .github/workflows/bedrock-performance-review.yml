name: AWS Bedrock Claude Performance Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: bedrock-performance-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-review:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Verify Bedrock access
        run: |
          aws sts get-caller-identity
          test -n "${{ vars.AWS_ROLE_TO_ASSUME }}" || (echo "Repository variable AWS_ROLE_TO_ASSUME is not configured" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/bedrock-review-requirements.txt

      - name: Run Claude performance review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AWS_REGION: us-east-1
        run: python scripts/bedrock_performance_review.py
